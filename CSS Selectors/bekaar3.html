<html>
<body>

    <h2>Student Registration</h2>

    <form>

        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Password:</label>
        <input type="password">

        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Hobbies:</label>

        <input type="checkbox"> Music
        <input type="checkbox"> Sports

        <br><br>

        <label>Course:</label>

        <select>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>

        <br><br>

        <label>Address:</label>

        <textarea></textarea>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
